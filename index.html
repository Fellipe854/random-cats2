<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Random Cats 🐱</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    #container {
      text-align: center;
    }

    img {
      max-width: 400px;
      border-radius: 10px;
    }

    #error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>🐱 Gato Aleatório</h1>
    <img id="catImage" alt="Imagem de gato">
    <p id="error"></p>
  </div>

  <script>
    async function carregarGato() {
      const catImage = document.getElementById('catImage');
      const errorMsg = document.getElementById('error');

      try {
        const resposta = await fetch('https://api.thecatapi.com/v1/images/search');
        const [dados] = await resposta.json();
        catImage.src = dados.url;
        errorMsg.textContent = '';
      } catch {
        errorMsg.textContent = 'Erro ao carregar imagem 😢';
      }
    }

    carregarGato();
  </script>
</body>
</html>
